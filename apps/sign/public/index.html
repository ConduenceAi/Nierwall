<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nierwall · Review and sign</title>
  <style>
    /* Nierwall blue (#3B82F6), black and white. Red only for errors and failed checks. */
    :root { --bg:#F5F5F5; --surface:#FFFFFF; --ink:#000000; --muted:#666666; --rule:#E0E0E0; --accent:#3B82F6; --near:#3B82F6; --ok:#3B82F6; --bad:#DC2626; --warn:#3B82F6; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#000000; --surface:#0D0D0D; --ink:#FFFFFF; --muted:#A3A3A3; --rule:#262626; --accent:#3B82F6; --near:#3B82F6; --ok:#3B82F6; --bad:#F87171; --warn:#3B82F6; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 18px 60px; }
    .eyebrow { font: 12px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: 24px; line-height: 1.25; margin: 6px 0 8px; }
    .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 16px 18px; margin-top: 14px; }
    .muted { color: var(--muted); font-size: 13px; }
    ul { list-style: none; margin: 0; padding: 0; }
    #checks li { padding: 3px 0; font-size: 14px; }
    #checks .ok { color: var(--ok); } #checks .bad { color: var(--bad); font-weight: 600; }
    #privacy { color: var(--warn); font-size: 14px; margin: 10px 0 0; }
    .step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
    .step:first-child { border-top: 0; }
    .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--accent); color: var(--accent); font: 12px ui-monospace, Menlo, monospace; }
    .step.done .n { background: var(--ok); border-color: var(--ok); color: var(--surface); }
    .step.failed .n { border-color: var(--bad); color: var(--bad); }
    .t { font-weight: 600; } .d { color: var(--muted); font-size: 14px; }
    .state { font: 11px ui-monospace, Menlo, monospace; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
    .hash { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
    button, a.button { margin-top: 8px; display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 8px 14px; font: 600 14px system-ui; cursor: pointer; text-decoration: none; }
    button:disabled { opacity: .5; cursor: default; }
    #error { color: var(--bad); margin-top: 12px; font-size: 14px; }
    #done { color: var(--ok); font-weight: 600; margin-top: 12px; }
    footer { margin-top: 18px; }
    input { font: 15px system-ui; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 9px; background: var(--surface); color: var(--ink); width: 100%; max-width: 320px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow" id="eyebrow">Nierwall · review and sign</div>
    <h1 id="title">Loading…</h1>
    <div id="health" class="muted"></div>
    <div class="card" id="checks-card"><div class="eyebrow">Checked before you sign</div><ul id="checks"></ul><p id="privacy" hidden></p></div>
    <div class="card"><ul id="steps"></ul></div>
    <div id="status" class="muted" role="status"></div>
    <div id="error" role="alert"></div>
    <div id="done" hidden>Done. Nierwall is refreshing your position.</div>
    <footer class="muted" id="footer">Nierwall never holds your keys. Each step opens your own wallet for approval. Nothing moves unless you approve it there.</footer>
  </main>
  <script type="module" src="/sign-assets/sign.js"></script>
</body>
</html>
